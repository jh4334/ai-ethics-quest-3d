name: GitHub Pages 배포

# main에 올라오면 테스트·빌드 통과 후 dist(게임 + trilogy.html 허브)를 배포한다.
# PR에서도 테스트·빌드를 돌려 깨진 코드가 main에 머지되는 것을 막는다.
# (저장소 Settings → Pages → Source를 "GitHub Actions"로 한 번 설정해 두어야 한다.)
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_ref:
        description: '배포할 검증 완료 태그 또는 커밋(비우면 main)'
        required: false
        default: ''

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    timeout-minutes: 120
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.deploy_ref || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: 의존성 설치
        run: npm ci
      - name: 고정 Chromium 설치
        if: inputs.deploy_ref == ''
        run: npx playwright install --with-deps chromium
      - name: 단위 테스트
        run: npm test
      - name: 빌드
        run: npm run build
      - name: 스모크 테스트
        run: npm run smoke
      - name: 수직 슬라이스 증거 게이트
        if: inputs.deploy_ref == ''
        run: npm run slice:gate
      - name: 2D 6장 데스크톱·모바일 완주 테스트
        if: inputs.deploy_ref == ''
        timeout-minutes: 10
        run: |
          npm run preview:test > /tmp/h17-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid"' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8899/ > /dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8899/ > /dev/null
          npm run qa:2d
      - name: 캠페인 브라우저 테스트
        if: inputs.deploy_ref == ''
        timeout-minutes: 30
        run: npm run e2e -- tests/reboot-e2e/campaign.spec.js --max-failures=1
      - name: 시각·접근성 브라우저 테스트
        if: inputs.deploy_ref == ''
        timeout-minutes: 30
        run: npm run e2e -- tests/reboot-e2e/h17-polish.spec.js --max-failures=1
      - name: 저장·오프라인 브라우저 테스트
        if: inputs.deploy_ref == ''
        timeout-minutes: 30
        run: npm run e2e -- tests/reboot-e2e/reboot.spec.js --max-failures=1
      - name: 결말 수직 슬라이스 브라우저 테스트
        if: inputs.deploy_ref == ''
        timeout-minutes: 30
        run: npm run e2e -- tests/reboot-e2e/slice.spec.js --max-failures=1
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
