<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#050918" />
  <title>H-17: NULL — 삭제된 밤</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #050918; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100svh; overflow: hidden; }
    [data-reboot-root] { min-height: 100svh; position: relative; background: #050918; }
    [data-reboot-canvas] { display: block; width: 100vw; height: 100svh; }
    .hud { position: fixed; inset: max(16px, env(safe-area-inset-top)) 16px auto; display: flex; justify-content: space-between; align-items: start; gap: 16px; pointer-events: none; }
    .title { margin: 0; color: #f4c06d; font-size: clamp(1rem, 3vw, 1.5rem); letter-spacing: .08em; text-shadow: 0 2px 12px #000; }
    .status { margin: .35rem 0 0; color: #d9e4ff; font-size: .9rem; }
    .combat-hud { display: flex; gap: 10px; margin-top: 8px; color: #d9e4ff; font-size: .78rem; }
    .combat-hud span { padding: 4px 7px; border: 1px solid #7b91bf66; border-radius: 5px; background: #050918aa; }
    .objective { position: fixed; top: max(112px, calc(env(safe-area-inset-top) + 96px)); left: 50%; translate: -50% 0; margin: 0; color: #fff3d6; font-size: clamp(.82rem, 2vw, 1rem); text-shadow: 0 2px 8px #000; }
    .actions { display: flex; gap: 8px; pointer-events: auto; }
    button { min-width: 48px; min-height: 44px; padding: 8px 12px; border: 1px solid #7b91bf; border-radius: 8px; color: #fff; background: #101a36dd; font: inherit; }
    button:focus-visible { outline: 3px solid #f4c06d; outline-offset: 2px; }
    .hint { position: fixed; left: 50%; bottom: max(18px, env(safe-area-inset-bottom)); translate: -50% 0; margin: 0; color: #d9e4ff; font-size: .82rem; text-align: center; text-shadow: 0 2px 8px #000; }
    .recovery { position: fixed; left: 50%; top: 82px; translate: -50% 0; max-width: min(90vw, 560px); margin: 0; padding: 10px 14px; border: 1px solid #f4c06d88; border-radius: 8px; color: #fff3d6; background: #101a36ee; text-align: center; }
    .radio { position: fixed; left: 50%; bottom: 64px; translate: -50% 0; width: min(88vw, 680px); margin: 0; padding: 10px 14px; border-left: 3px solid #5de0c1; color: #eef5ff; background: #050918d9; text-shadow: 0 2px 8px #000; }
    .radio strong { margin-right: 8px; color: #5de0c1; }
    .feedback-prompts { position: fixed; right: 18px; bottom: max(74px, calc(env(safe-area-inset-bottom) + 62px)); max-width: min(42vw, 360px); margin: 0; padding: 7px 10px; border-right: 3px solid #f4c06d; color: #fff3d6; background: #050918c9; font-size: .78rem; text-align: right; text-shadow: 0 2px 8px #000; }
    .touch-controls { display: none; position: fixed; inset: auto 0 max(14px, env(safe-area-inset-bottom)); z-index: 5; pointer-events: none; }
    .touch-stick { position: absolute; left: max(18px, env(safe-area-inset-left)); bottom: 0; width: 132px; height: 132px; border: 2px solid #8ba5d077; border-radius: 50%; background: #08112699; pointer-events: auto; touch-action: none; }
    .touch-stick::before, .touch-stick::after { content: ''; position: absolute; background: #a9bce944; pointer-events: none; }
    .touch-stick::before { inset: 14px 64px; }
    .touch-stick::after { inset: 64px 14px; }
    .touch-stick-knob { position: absolute; left: 44px; top: 44px; width: 42px; height: 42px; border: 2px solid #5de0c1; border-radius: 50%; background: #17365dcc; pointer-events: none; }
    .touch-actions { position: absolute; right: max(18px, env(safe-area-inset-right)); bottom: 0; display: grid; grid-template-columns: repeat(4, minmax(50px, 64px)); gap: 8px; pointer-events: auto; }
    .touch-actions button { min-width: 50px; min-height: 52px; padding: 5px; font-size: .7rem; touch-action: none; }
    [data-touch-action="attack"] { border-color: #f4c06d; background: #4a2d21e8; }
    [data-touch-action="reflect"], [data-touch-action="trace"], [data-touch-action="secure"] { border-color: #5de0c1; }
    @media (pointer: coarse), (max-width: 760px) {
      .touch-controls { display: block; }
      .hint { display: none; }
      .feedback-prompts { bottom: 160px; max-width: 54vw; }
      .radio { bottom: 162px; }
      .combat-hud { max-width: 52vw; flex-wrap: wrap; }
    }
    [data-touch-mode="true"] .touch-controls { display: block; }
    [data-touch-mode="true"] .hint { display: none; }
    [data-touch-mode="true"] .hud { right: auto; width: calc(var(--fixture-width) - 32px); }
    [data-touch-mode="true"] .touch-actions { right: auto; left: calc(var(--fixture-width) - 282px); }
    [data-touch-mode="true"] .feedback-prompts { right: auto; left: calc(var(--fixture-width) - min(42vw, 360px) - 18px); }
    .chapter-result { position: fixed; inset: 50% auto auto 50%; translate: -50% -50%; z-index: 3; width: min(88vw, 620px); padding: 22px; border: 1px solid #f4c06d88; border-radius: 12px; background: #081126f2; box-shadow: 0 20px 80px #000a; }
    .chapter-result h2 { margin: 0 0 14px; color: #f4c06d; }
    .chapter-result p { margin: 9px 0; color: #e9f0ff; line-height: 1.55; }
    .patch-picker { position: fixed; left: 50%; bottom: 28px; translate: -50% 0; z-index: 4; padding: 12px; border: 1px solid #5de0c188; border-radius: 10px; background: #081126ee; }
    .patch-picker p { margin: 0 0 8px; color: #5de0c1; text-align: center; }
    .test-storage { position: fixed; left: 12px; bottom: 12px; z-index: 4; max-width: min(92vw, 700px); padding: 8px; border: 1px dashed #6aa9ff; background: #050918ee; }
    .test-storage pre { max-height: 110px; overflow: auto; margin: 8px 0 0; color: #bfe8ff; font-size: 11px; white-space: pre-wrap; }
    .viewport-tools { position: fixed; left: 50%; top: 10px; translate: -50% 0; z-index: 8; display: flex; gap: 6px; }
    .viewport-tools button { min-height: 34px; padding: 4px 8px; font-size: .7rem; }
  </style>
</head>
<body>
  <main data-reboot-root data-app-marker="H-17 Reboot">
    <canvas data-reboot-canvas aria-label="00시 17분의 어두운 학교 복도"></canvas>
    <section class="hud" aria-label="게임 상태와 제어">
      <div>
        <h1 class="title">H-17: NULL</h1>
        <p class="status" data-reboot-status aria-live="polite">학교 기록 연결 중</p>
        <div class="combat-hud" aria-label="전투 상태">
          <span data-combat-health>HP 100</span>
          <span data-combat-action>READY</span>
          <span data-combat-chain>SYNC 0</span>
          <span data-enemy-status>ARMOR 1</span>
        </div>
      </div>
      <div class="actions">
        <button type="button" data-pause>일시정지</button>
        <button type="button" data-restart>다시 시작</button>
      </div>
    </section>
    <p class="objective" data-route-objective>교실 기록 단말로 이동</p>
    <p class="recovery" data-recovery-notice role="status" hidden></p>
    <p class="radio" data-radio-subtitle aria-live="polite" hidden><strong data-radio-speaker></strong><span data-radio-text></span></p>
    <p class="feedback-prompts" data-feedback-prompts role="status" aria-live="polite" hidden></p>
    <section class="chapter-result" data-chapter-result hidden aria-label="1장 결과">
      <h2>00:17 — 출석번호 없음</h2>
      <p data-result-action></p>
      <p data-result-consequence></p>
      <p data-result-reversal></p>
    </section>
    <section class="patch-picker" data-patch-picker hidden aria-label="PATCH 선택">
      <p>남길 PATCH 하나를 선택</p>
      <button type="button" data-patch-id="reflect-arc">반사 범위</button>
      <button type="button" data-patch-id="trace-speed">추적 속도</button>
      <button type="button" data-patch-id="chain-persistence">연계 유지</button>
    </section>
    <section class="touch-controls" data-touch-controls aria-label="터치 조작">
      <div class="touch-stick" data-touch-stick aria-label="이동 스틱"><span class="touch-stick-knob" data-touch-stick-knob></span></div>
      <div class="touch-actions">
        <button type="button" data-touch-action="attack">공격</button>
        <button type="button" data-touch-action="dash">회피</button>
        <button type="button" data-touch-action="reflect">반사</button>
        <button type="button" data-touch-action="trace">추적</button>
        <button type="button" data-touch-action="secure">확보</button>
        <button type="button" data-touch-action="purge">소거</button>
        <button type="button" data-touch-action="camera-reset">카메라</button>
        <button type="button" data-touch-action="pause">정지</button>
      </div>
    </section>
    <p class="hint">WASD·방향키 이동 · J 공격 · K 반사 · E 추적 · F 확보 · Q 소거</p>
    <section class="test-storage" data-test-storage hidden aria-label="저장 QA 도구">
      <button type="button" data-test-seed-v3>v3 심기</button>
      <button type="button" data-test-checkpoint>체크포인트</button>
      <button type="button" data-test-corrupt>v4 손상</button>
      <pre data-test-output></pre>
    </section>
    <div class="viewport-tools" data-test-viewport-tools hidden aria-label="화면 회전 QA 도구">
      <button type="button" data-test-viewport="portrait">세로</button>
      <button type="button" data-test-viewport="landscape">가로</button>
    </div>
  </main>
  <script type="module" src="/src/reboot/entry.js"></script>
</body>
</html>
