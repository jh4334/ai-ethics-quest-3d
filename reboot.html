<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#050918" />
  <title>H-17: NULL — 삭제된 밤</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #050918; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100svh; overflow: hidden; }
    /* 공용 치수 — QA 뷰포트 fixture가 --fixture-width를 지정하면 오른쪽 기준선이 fixture 폭으로 좁혀진다. */
    [data-reboot-root] {
      min-height: 100svh; position: relative; background: #050918;
      --safe-bottom: max(14px, env(safe-area-inset-bottom));
      --edge-right: max(14px, env(safe-area-inset-right));
      --hud-top: max(16px, env(safe-area-inset-top));
      --fixture-edge: var(--fixture-width, 100vw);
    }
    [data-reboot-canvas] { display: block; width: 100vw; height: 100svh; }
    .hud { position: fixed; inset: max(16px, env(safe-area-inset-top)) 16px auto; display: flex; justify-content: space-between; align-items: start; gap: 16px; pointer-events: none; }
    .title { margin: 0; color: #f4c06d; font-size: clamp(1rem, 3vw, 1.5rem); letter-spacing: .08em; text-shadow: 0 2px 12px #000; }
    .status { margin: .35rem 0 0; color: #d9e4ff; font-size: .9rem; }
    .combat-hud { display: flex; gap: 10px; margin-top: 8px; color: #d9e4ff; font-size: .78rem; }
    .combat-hud > span { padding: 4px 7px; border: 1px solid #7b91bf66; border-radius: 5px; background: #050918aa; }
    /* 채움형 게이지 — HP는 붉은/호박, 시그널은 시안. 라벨 글씨는 채움 위에서도 또렷하게. */
    .combat-hud .gauge { position: relative; min-width: 118px; overflow: hidden; transition: box-shadow .35s ease-out; }
    .gauge-fill { position: absolute; left: 0; top: 0; bottom: 0; width: 100%; border-radius: 4px; transition: width .18s ease-out; pointer-events: none; }
    .gauge-hp .gauge-fill { background: linear-gradient(90deg, #a63d33, #e08a3f); }
    .gauge-signal .gauge-fill { background: linear-gradient(90deg, #1d7d8f, #5de0c1); }
    .gauge-label { position: relative; color: #fff; font-style: normal; font-weight: 700; letter-spacing: .04em; text-shadow: 0 1px 3px #000c; }
    /* 시그널 부족(signal-blocked) 깜빡임 — 클래스는 이벤트 프레임에만 붙고, 꺼질 때 transition으로만 잦아든다. */
    .gauge-blocked { box-shadow: 0 0 0 2px #ff6b6bcc, 0 0 14px #ff6b6b99; transition: none; }
    .objective { position: fixed; top: max(112px, calc(env(safe-area-inset-top) + 96px)); left: 50%; translate: -50% 0; max-width: min(72vw, 620px); margin: 0; padding: 6px 10px; border-radius: 6px; color: #fff3d6; background: #050918b8; font-size: clamp(.82rem, 2vw, 1rem); line-height: 1.35; text-align: center; text-shadow: 0 2px 8px #000; }
    .actions { display: flex; gap: 8px; pointer-events: auto; }
    button { min-width: 48px; min-height: 44px; padding: 8px 12px; border: 1px solid #7b91bf; border-radius: 8px; color: #fff; background: #101a36dd; font: inherit; }
    button:focus-visible { outline: 3px solid #f4c06d; outline-offset: 2px; }
    .hint { position: fixed; left: 50%; bottom: max(18px, env(safe-area-inset-bottom)); translate: -50% 0; margin: 0; color: #d9e4ff; font-size: .82rem; text-align: center; text-shadow: 0 2px 8px #000; }
    .recovery { position: fixed; left: 50%; top: 82px; translate: -50% 0; max-width: min(90vw, 560px); margin: 0; padding: 10px 14px; border: 1px solid #f4c06d88; border-radius: 8px; color: #fff3d6; background: #101a36ee; text-align: center; }
    .radio { position: fixed; left: 50%; bottom: 64px; translate: -50% 0; z-index: 4; width: min(88vw, 680px); margin: 0; padding: 10px 14px; border-left: 3px solid #5de0c1; color: #eef5ff; background: #050918e8; line-height: 1.45; text-shadow: 0 2px 8px #000; }
    .radio strong { margin-right: 8px; color: #5de0c1; }
    .feedback-prompts { position: fixed; right: 18px; bottom: max(142px, calc(env(safe-area-inset-bottom) + 130px)); z-index: 4; max-width: min(42vw, 360px); margin: 0; padding: 7px 10px; border-right: 3px solid #f4c06d; color: #fff3d6; background: #050918e3; font-size: .78rem; line-height: 1.4; text-align: right; text-shadow: 0 2px 8px #000; }
    /* ── 터치 조작(S4a) — 왼쪽 이동 스틱 · 오른쪽 엄지 부채꼴 4버튼 · 결정 시에만 뜨는 맥락 버튼 · 우상단 보조 버튼 ── */
    .touch-controls { display: none; position: fixed; inset: 0; z-index: 5; pointer-events: none; }
    .touch-stick { position: absolute; left: max(18px, env(safe-area-inset-left)); bottom: var(--safe-bottom); width: 132px; height: 132px; border: 2px solid #8ba5d077; border-radius: 50%; background: #08112699; pointer-events: auto; touch-action: none; }
    .touch-stick::before, .touch-stick::after { content: ''; position: absolute; background: #a9bce944; pointer-events: none; }
    .touch-stick::before { inset: 14px 64px; }
    .touch-stick::after { inset: 64px 14px; }
    .touch-stick-knob { position: absolute; left: 44px; top: 44px; width: 42px; height: 42px; border: 2px solid #5de0c1; border-radius: 50%; background: #17365dcc; pointer-events: none; }
    /* 1차 버튼 부채꼴 — 공격이 가장 크게 오른쪽 아래 모서리, 회피·반사·추적이 호를 그린다. 스틱과 절대 겹치지 않는 150px 상자. */
    .touch-actions { position: absolute; left: calc(var(--fixture-edge) - var(--edge-right) - 150px); bottom: var(--safe-bottom); width: 150px; height: 150px; }
    .touch-actions button { position: absolute; min-width: 0; min-height: 0; padding: 0; border-radius: 50%; font-size: .7rem; pointer-events: auto; touch-action: none; }
    [data-touch-action="attack"] { right: 0; bottom: 0; width: 72px; height: 72px; border-color: #f4c06d; background: #4a2d21e8; font-size: .82rem; font-weight: 700; }
    [data-touch-action="dash"] { right: 88px; bottom: 4px; width: 56px; height: 56px; border-color: #8ba5d0; }
    [data-touch-action="reflect"] { right: 4px; bottom: 88px; width: 56px; height: 56px; }
    [data-touch-action="trace"] { right: 74px; bottom: 74px; width: 56px; height: 56px; }
    [data-touch-action="reflect"], [data-touch-action="trace"], [data-touch-action="secure"] { border-color: #5de0c1; }
    /* 맥락 버튼(확보 F·소거 Q) — 결정 대기 상태에서만 부채꼴 위로 나타난다.
       display가 아니라 opacity·pointer-events로만 숨겨 DOM·dispatchEvent 경로를 유지한다. */
    .touch-context { position: absolute; left: calc(var(--fixture-edge) - var(--edge-right) - 202px); bottom: calc(var(--safe-bottom) + 164px); display: flex; gap: 10px; opacity: 0; translate: 0 8px; transition: opacity .18s ease-out, translate .18s ease-out; }
    .touch-context button { width: 96px; min-height: 52px; padding: 5px 8px; border-radius: 10px; font-size: .8rem; font-weight: 700; pointer-events: none; touch-action: none; }
    .touch-context button small { display: block; font-size: .58rem; font-weight: 400; color: #cfe0ff; }
    [data-touch-action="secure"] { background: #0f2f33e8; }
    [data-touch-action="purge"] { border-color: #e08a3f; background: #33210fe8; }
    /* 결정 대기 신호 — 1장 기억 단말 단계, 2~4장 웨이브 전멸 후, 마지막 방송 승리 직후에만 맥락 버튼을 연다. */
    [data-reboot-canvas]:is(
      [data-story-phase="memory-decision"], [data-story-phase="memory-traced"], [data-story-phase="memory-secure-ready"],
      [data-campaign-expected-action="decision"][data-campaign-completed="false"],
      [data-protocol-status="victory"]:not([data-campaign-ending])
    ) ~ .touch-controls .touch-context { opacity: 1; translate: 0 0; }
    [data-reboot-canvas]:is(
      [data-story-phase="memory-decision"], [data-story-phase="memory-traced"], [data-story-phase="memory-secure-ready"],
      [data-campaign-expected-action="decision"][data-campaign-completed="false"],
      [data-protocol-status="victory"]:not([data-campaign-ending])
    ) ~ .touch-controls .touch-context button { pointer-events: auto; }
    /* 보스 동사 강조(S5) — 감독관이 요구하는 동사 버튼이 맥동한다. data-boss-verb는 HUD가 매 프레임 갱신. */
    @keyframes boss-verb-pulse {
      0%, 100% { box-shadow: 0 0 0 0 #5de0c100; }
      50% { box-shadow: 0 0 0 6px #5de0c155, 0 0 18px #5de0c1aa; }
    }
    [data-reboot-canvas][data-boss-verb="reflect"] ~ .touch-controls [data-touch-action="reflect"],
    [data-reboot-canvas][data-boss-verb="trace"] ~ .touch-controls [data-touch-action="trace"],
    [data-reboot-canvas][data-boss-verb="attack"] ~ .touch-controls [data-touch-action="attack"] {
      animation: boss-verb-pulse .9s ease-in-out infinite;
      border-color: #5de0c1;
    }
    @media (prefers-reduced-motion: reduce) {
      [data-reboot-canvas][data-boss-verb="reflect"] ~ .touch-controls [data-touch-action="reflect"],
      [data-reboot-canvas][data-boss-verb="trace"] ~ .touch-controls [data-touch-action="trace"],
      [data-reboot-canvas][data-boss-verb="attack"] ~ .touch-controls [data-touch-action="attack"] {
        animation: none;
        box-shadow: 0 0 0 3px #5de0c199;
      }
    }
    /* 보조 버튼(카메라·정지) — 우상단 일시정지 열 아래 작은 버튼으로. */
    .touch-utils { position: absolute; top: calc(var(--hud-top) + 50px); left: calc(var(--fixture-edge) - var(--edge-right) - 48px); display: flex; flex-direction: column; gap: 8px; }
    .touch-utils button { width: 48px; min-width: 0; min-height: 44px; padding: 2px 4px; font-size: .62rem; pointer-events: auto; touch-action: none; }
    @media (prefers-reduced-motion: reduce) { .touch-context { transition: none; } }
    @media (pointer: coarse), (max-width: 760px) {
      .touch-controls { display: block; }
      .hint { display: none; }
    }
    [data-touch-mode="true"] .touch-controls { display: block; }
    [data-touch-mode="true"] .hint { display: none; }
    /* ── 터치 HUD 압축(세로 기본) — 게이지 1행 + 상태 칩 1행, 우상단 버튼은 줄바꿈 금지 ── */
    [data-touch-mode="true"] .hud { display: block; right: auto; width: calc(var(--fixture-edge) - 32px); }
    [data-touch-mode="true"] .title { font-size: 1rem; }
    [data-touch-mode="true"] .status { font-size: .72rem; margin-top: .2rem; }
    [data-touch-mode="true"] .actions { position: absolute; top: 0; right: 0; gap: 6px; }
    [data-touch-mode="true"] .actions button { min-width: 0; padding: 8px 10px; font-size: .8rem; white-space: nowrap; }
    [data-touch-mode="true"] .combat-hud { flex-wrap: wrap; gap: 6px; max-width: calc(100% - 64px); }
    [data-touch-mode="true"] .combat-hud .gauge { flex: 1 1 40%; min-width: 118px; }
    [data-touch-mode="true"] .combat-hud > span:not(.gauge) { flex: 0 0 auto; font-size: .68rem; padding: 3px 6px; white-space: nowrap; }
    /* 목표 문구는 HUD 아래 상단 밴드에 고정 — 화면 중앙·보조 버튼 열을 침범하지 않는다. */
    [data-touch-mode="true"] .objective { top: calc(var(--hud-top) + 108px); max-width: min(calc(100vw - 136px), 620px); }
    [data-touch-mode="true"] .feedback-prompts { right: auto; left: calc(var(--fixture-edge) - min(60vw, 340px) - 18px); bottom: calc(var(--safe-bottom) + 256px); max-width: min(60vw, 340px); }
    [data-touch-mode="true"] .radio { bottom: calc(var(--safe-bottom) + 170px); width: min(calc(100vw - 40px), 600px); }
    /* 세로 결정 대기 중에는 자막·피드백 칩을 한 단 올려 맥락 버튼 띠를 비워 둔다(가로에서는 띠가 겹치지 않음). */
    @media (orientation: portrait) {
      [data-touch-mode="true"] [data-reboot-canvas]:is(
        [data-story-phase="memory-decision"], [data-story-phase="memory-traced"], [data-story-phase="memory-secure-ready"],
        [data-campaign-expected-action="decision"][data-campaign-completed="false"],
        [data-protocol-status="victory"]:not([data-campaign-ending])
      ) ~ .radio { bottom: calc(var(--safe-bottom) + 226px); }
      [data-touch-mode="true"] [data-reboot-canvas]:is(
        [data-story-phase="memory-decision"], [data-story-phase="memory-traced"], [data-story-phase="memory-secure-ready"],
        [data-campaign-expected-action="decision"][data-campaign-completed="false"],
        [data-protocol-status="victory"]:not([data-campaign-ending])
      ) ~ .feedback-prompts { bottom: calc(var(--safe-bottom) + 310px); }
    }
    [data-touch-mode="true"] .patch-picker { bottom: calc(var(--safe-bottom) + 170px); }
    /* 실기기 가로모드 — HUD를 한 줄로 압축하고 목표는 상단 중앙, 무전 자막은 하단 중앙에 둔다(QA fixture 화면엔 적용 안 함). */
    @media (orientation: landscape) {
      [data-touch-mode="true"]:not([data-viewport-fixture]) .title { display: none; }
      [data-touch-mode="true"]:not([data-viewport-fixture]) .status { margin-top: 0; }
      [data-touch-mode="true"]:not([data-viewport-fixture]) .combat-hud { margin-top: 4px; flex-wrap: nowrap; max-width: calc(100% - 200px); }
      [data-touch-mode="true"]:not([data-viewport-fixture]) .combat-hud .gauge { flex: 0 1 130px; min-width: 96px; }
      [data-touch-mode="true"]:not([data-viewport-fixture]) .objective { top: calc(var(--hud-top) + 56px); max-width: 46vw; }
      [data-touch-mode="true"]:not([data-viewport-fixture]) .radio { bottom: var(--safe-bottom); width: min(52vw, 440px); }
      [data-touch-mode="true"]:not([data-viewport-fixture]) .feedback-prompts { bottom: calc(var(--safe-bottom) + 230px); max-width: 32vw; }
      [data-touch-mode="true"]:not([data-viewport-fixture]) .touch-context { bottom: calc(var(--safe-bottom) + 172px); }
      [data-touch-mode="true"]:not([data-viewport-fixture]) .campaign-continue { bottom: calc(var(--safe-bottom) + 160px); }
    }
    .chapter-result { position: fixed; inset: 50% auto auto 50%; translate: -50% -50%; z-index: 3; width: min(88vw, 620px); padding: 22px; border: 1px solid #f4c06d88; border-radius: 12px; background: #081126f2; box-shadow: 0 20px 80px #000a; }
    .chapter-result h2 { margin: 0 0 14px; color: #f4c06d; }
    .chapter-result p { margin: 9px 0; color: #e9f0ff; line-height: 1.55; }
    .chapter-result [data-result-action] { color: #fff3d6; font-weight: 700; }
    .chapter-result [data-result-consequence] { padding-top: 9px; border-top: 1px solid #7b91bf55; }
    .chapter-result [data-result-reversal] { color: #a9d9ff; }
    body:has(.chapter-result:not([hidden])) .objective,
    body:has(.chapter-result:not([hidden])) .radio,
    body:has(.chapter-result:not([hidden])) .hint,
    body:has(.chapter-result:not([hidden])) .feedback-prompts { display: none; }
    @media (pointer: coarse), (max-width: 760px) {
      .chapter-result { top: calc(50% - 34px); width: calc(100vw - 48px); max-height: calc(100svh - 300px); overflow: auto; padding: 18px; }
      .chapter-result h2 { font-size: 1.25rem; }
      .chapter-result p { font-size: .94rem; line-height: 1.45; }
    }
    .patch-picker { position: fixed; left: 50%; bottom: 28px; translate: -50% 0; z-index: 4; padding: 12px; border: 1px solid #5de0c188; border-radius: 10px; background: #081126ee; }
    .patch-picker p { margin: 0 0 8px; color: #5de0c1; text-align: center; }
    .campaign-continue { position: fixed; left: 50%; bottom: 28px; translate: -50% 0; z-index: 6; border-color: #f4c06d; background: #332611ee; }
    /* 계속 버튼 — 터치에서는 부채꼴·맥락 버튼 띠 위로 올려 절대 겹치지 않게 한다. */
    [data-touch-mode="true"] .campaign-continue { bottom: calc(var(--safe-bottom) + 196px); }
    .test-storage { position: fixed; left: 12px; bottom: 12px; z-index: 4; max-width: min(92vw, 700px); padding: 8px; border: 1px dashed #6aa9ff; background: #050918ee; }
    .test-storage pre { max-height: 110px; overflow: auto; margin: 8px 0 0; color: #bfe8ff; font-size: 11px; white-space: pre-wrap; }
    .viewport-tools { position: fixed; left: 50%; top: 10px; translate: -50% 0; z-index: 8; display: flex; gap: 6px; }
    .viewport-tools[hidden] { display: none; }
    .viewport-tools button { min-height: 34px; padding: 4px 8px; font-size: .7rem; }
  </style>
</head>
<body>
  <main data-reboot-root data-app-marker="H-17 Reboot">
    <canvas data-reboot-canvas aria-label="00시 17분의 어두운 학교 복도"></canvas>
    <section class="hud" aria-label="게임 상태와 제어">
      <div>
        <h1 class="title">H-17: NULL</h1>
        <p class="status" data-reboot-status aria-live="polite">학교 기록 연결 중</p>
        <div class="combat-hud" aria-label="전투 상태">
          <span class="gauge gauge-hp" data-combat-health><i class="gauge-fill" data-combat-health-fill></i><b class="gauge-label" data-combat-health-label>HP 100</b></span>
          <span class="gauge gauge-signal" data-combat-signal><i class="gauge-fill" data-combat-signal-fill></i><b class="gauge-label" data-combat-signal-label>SIGNAL 100</b></span>
          <span data-combat-action>READY</span>
          <span data-combat-chain>SYNC 0</span>
          <span data-enemy-status>ARMOR 1</span>
        </div>
      </div>
      <div class="actions">
        <button type="button" data-pause>일시정지</button>
        <button type="button" data-restart>다시 시작</button>
      </div>
    </section>
    <p class="objective" data-route-objective>교실 기록 단말로 이동</p>
    <p class="recovery" data-recovery-notice role="status" hidden></p>
    <p class="radio" data-radio-subtitle aria-live="polite" hidden><strong data-radio-speaker></strong><span data-radio-text></span></p>
    <p class="feedback-prompts" data-feedback-prompts role="status" aria-live="polite" hidden></p>
    <section class="chapter-result" data-chapter-result hidden aria-label="1장 결과" role="status" aria-live="polite" aria-atomic="true">
      <h2>00:17 — 출석번호 없음</h2>
      <p data-result-action></p>
      <p data-result-consequence></p>
      <p data-result-reversal></p>
    </section>
    <section class="patch-picker" data-patch-picker hidden aria-label="PATCH 선택">
      <p>남길 PATCH 하나를 선택</p>
      <button type="button" data-patch-id="reflect-arc">반사 범위</button>
      <button type="button" data-patch-id="trace-speed">추적 속도</button>
      <button type="button" data-patch-id="chain-persistence">연계 유지</button>
    </section>
    <button class="campaign-continue" type="button" data-campaign-continue hidden>다음 장 계속</button>
    <section class="touch-controls" data-touch-controls aria-label="터치 조작">
      <div class="touch-stick" data-touch-stick aria-label="이동 스틱"><span class="touch-stick-knob" data-touch-stick-knob></span></div>
      <div class="touch-context" data-touch-context aria-label="결정 버튼">
        <button type="button" data-touch-action="secure">확보<small>기록 보존</small></button>
        <button type="button" data-touch-action="purge">소거<small>빠른 중단</small></button>
      </div>
      <div class="touch-actions" aria-label="전투 버튼">
        <button type="button" data-touch-action="attack">공격</button>
        <button type="button" data-touch-action="dash">회피</button>
        <button type="button" data-touch-action="reflect">반사</button>
        <button type="button" data-touch-action="trace">추적</button>
      </div>
      <div class="touch-utils" data-touch-utils aria-label="보조 버튼">
        <button type="button" data-touch-action="camera-reset">카메라</button>
        <button type="button" data-touch-action="pause">정지</button>
      </div>
    </section>
    <p class="hint">WASD·방향키 이동 · J 공격 · K 반사 · E 추적 · F 확보 · Q 소거</p>
    <section class="test-storage" data-test-storage hidden aria-label="저장 QA 도구">
      <button type="button" data-test-seed-v3>v3 심기</button>
      <button type="button" data-test-checkpoint>체크포인트</button>
      <button type="button" data-test-corrupt>v4 손상</button>
      <pre data-test-output></pre>
    </section>
    <div class="viewport-tools" data-test-viewport-tools hidden aria-label="화면 회전 QA 도구">
      <button type="button" data-test-viewport="portrait">세로</button>
      <button type="button" data-test-viewport="landscape">가로</button>
    </div>
  </main>
  <script type="module" src="/src/reboot/entry.js"></script>
  <script>
    const swDisabledForQa = new URLSearchParams(window.location.search).get('sw') === 'off';
    if ('serviceWorker' in navigator && window.location.port !== '5173' && !swDisabledForQa) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }
  </script>
</body>
