<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="삭제된 학생 H-17의 결정 경로를 추적하는 5장 3D 액션 스릴러" />
  <meta name="theme-color" content="#050918" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icon.svg" type="image/svg+xml" />
  <title>H-17: NULL — 삭제된 밤</title>
</head>
<body>
  <p>H-17: NULL을 여는 중입니다. <a href="./reboot.html">게임 바로 열기</a></p>
  <script>
    const rebootUrl = new URL('./reboot.html', window.location.href);
    rebootUrl.search = window.location.search;
    rebootUrl.hash = window.location.hash;
    window.location.replace(rebootUrl.href);
  </script>
  <script>
    if ('serviceWorker' in navigator && window.location.port !== '5173') {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
