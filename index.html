<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="레퍼런스 원화 속에서 사라진 친구 하루의 흔적을 찾는 2D 이야기 게임" />
  <meta name="theme-color" content="#050918" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icon.svg" type="image/svg+xml" />
  <title>사라진 학생 H-17 — 2D 이야기</title>
</head>
<body>
  <p>사라진 학생 H-17을 여는 중입니다. <a href="./illustrated.html">2D 게임 바로 열기</a></p>
  <script>
    const illustratedUrl = new URL('./illustrated.html', window.location.href);
    illustratedUrl.search = window.location.search;
    illustratedUrl.hash = window.location.hash;
    window.location.replace(illustratedUrl.href);
  </script>
  <script>
    if ('serviceWorker' in navigator && window.location.port !== '5173') {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
